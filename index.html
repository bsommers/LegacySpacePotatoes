<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Potatoes</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="ui-layer">
      <div id="hud-top">
        <div class="health-container">
          <div class="health-label">HEALTH</div>
          <div class="health-bar-bg">
            <div id="health-bar-fill"></div>
          </div>
        </div>
        <div class="score-container">
          <div class="score-label">LEVEL</div>
          <div id="level-value">1</div>
        </div>
        <div class="score-container">
          <div class="score-label">TIME</div>
          <div id="timer-value">0:00</div>
        </div>
        <div class="score-container">
          <div class="score-label">FOOD</div>
          <div id="food-value">0</div>
        </div>
        <div class="score-container">
          <div class="score-label">FARTS</div>
          <div id="farts-value">0</div>
        </div>
        <div class="score-container">
          <div class="score-label">SCORE</div>
          <div id="score-value">0</div>
        </div>
      </div>
      <div id="game-over-screen" class="hidden">
        <h1>GAME OVER</h1>
        <p>Level Reached: <span id="final-level">1</span></p>
        <p>Score: <span id="final-score">0</span></p>
        <p>Cat Food Earned: <span id="final-food">0</span></p>
        <button id="restart-btn">PLAY AGAIN</button>
      </div>
      <div id="pause-screen" class="hidden">
        <h1>PAUSED</h1>
        <p>Press ESC to resume</p>
        <p>Press Q to quit/restart</p>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <script type="module" src="./game.js"></script>
  </body>
</html>
